# golangci-lint v2 configuration. gostrict uses it on itself, and it is a
# starting point for modules that use gostrict: linters that catch bugs and
# unfinished work, not style.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - godox
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # memory layout, not correctness
        - shadow # flags every idiomatic `if err := f(); err != nil`
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - testdata

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
