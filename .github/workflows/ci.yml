name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: strictcheck (the repository checks itself)
        run: go run ./cmd/strictcheck -format text -steps compile,analyze

      # Built with the Go from go.mod: golangci-lint and NilAway refuse
      # modules newer than the Go that built them.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: NilAway
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260918162853-acb8859b9031
          nilaway -include-pkgs=github.com/tcw/gostrict ./...
